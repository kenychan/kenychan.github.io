<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #fff;
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(560px, calc(100vw - 40px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        font-weight: 700;
      }

      p {
        margin: 0 0 10px;
        line-height: 1.45;
      }

      a {
        color: #0645ad;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 Not Found</h1>
      <p>The requested page could not be found on this site.</p>
      <p>The link may be outdated, mistyped, or not included in this static upload.</p>

    </main>
  </body>
</html>
