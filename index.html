<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Episode 1 Random Index</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #fff;
      }

      body {
        overflow: hidden;
      }

      .noscript {
        padding: 16px;
        color: #111;
        font: 14px Arial, sans-serif;
      }
    </style>
    <script>
      const destinations = [
        './minihome/',
        './myfavgame2005/index.html',
        './404.html',
        './world_loading/'
      ];

      const randomIndex = (() => {
        if (window.crypto?.getRandomValues) {
          const values = new Uint32Array(1);
          window.crypto.getRandomValues(values);
          return values[0] % destinations.length;
        }

        return Math.floor(Math.random() * destinations.length);
      })();

      window.addEventListener('DOMContentLoaded', () => {
        window.location.replace(destinations[randomIndex]);
      });
    </script>
  </head>
  <body>
    <noscript>
      <div class="noscript">
        <p>JavaScript is required for random launch.</p>
        <p>
          <a href="./minihome/">minihome</a>
          <a href="./myfavgame2005/index.html">myfavgame2005</a>
          <a href="./404.html">404</a>
          <a href="./world_loading/">world loading</a>
        </p>
      </div>
    </noscript>
  </body>
</html>
